<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build Your Own Atom - Atomaker</title>

    <link href="https://fonts.googleapis.com/css2?family=Playpen+Sans:wght@700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e6e6fa; 
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #d0c8f0;
            padding: 10px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .logo-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-title h1 {
            color: #4169e1;
            font-size: 28px;
            margin: 0;
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            font-weight: normal;
        }

        .logo-title h2 {
            font-size: 16px;
            color: #4169e1;
            margin: 0;
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            font-weight: normal;
        }

        nav a {
            margin: 0 15px;
            text-decoration: none;
            color: #3333cc;
            font-weight: bold;
            font-size: 16px;
        }

        .atom-container {
            width: 100%;
            height: calc(100vh - 80px);
            position: relative;
            background: #080c12;
        }

        .atom-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .footer {
            text-align: center;
            padding: 15px;
            font-size: 14px;
            color: #4169e1;
            background-color: #d0c8f0;
            font-family: "Playpen Sans", cursive;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                text-align: center;
                gap: 12px;
                padding: 12px 15px;
            }
            nav {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px 16px;
            }
            nav a {
                margin: 0 4px;
                font-size: 15px;
            }
            .atom-container {
                height: calc(100vh - 110px);
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-title">
            <img src="/atomaker-logo.png" alt="Atomaker Logo" style="height:40px;">
            <div>
                <h1>Atomaker</h1>
                <h2>Visualizing the Invisible</h2>
            </div>
        </div>
        <nav>
            <a href="/homepage.html">Home</a>
            <a href="/aboutus.html">About Us</a>
            <a href="/ourmission.html">Our Mission</a>
            <a href="/layout.html">Layout</a>
        </nav>
    </header>

    <div class="atom-container">
        <iframe id="atomFrame" src="/atom/" title="Build Your Own Atom" allowfullscreen></iframe>
    </div>

    <script>
        // Forward extra subpath/query/hash (e.g. /buildyourownatom.html/carbon or /buildyourownatom.html?element=carbon or #carbon) to iframe
        (function() {
            const path = window.location.pathname;
            const search = window.location.search;
            const hash = window.location.hash;
            const iframe = document.getElementById('atomFrame');
            
            if (iframe) {
                // If there's an extra path component after buildyourownatom.html or query/hash
                let extra = '';
                const match = path.match(/buildyourownatom\.html\/(.+)/i);
                if (match && match[1]) {
                    extra = match[1];
                } else if (search) {
                    extra = search;
                } else if (hash) {
                    extra = hash;
                }

                if (extra) {
                    const cleanExtra = extra.startsWith('/') ? extra.slice(1) : extra;
                    iframe.src = '/atom/' + cleanExtra;
                } else {
                    iframe.src = '/atom/';
                }
            }
        })();
    </script>
</body>
</html>
