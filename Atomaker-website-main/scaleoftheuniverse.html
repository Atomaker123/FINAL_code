<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scale of the Universe - Atomaker</title>

    <link href="https://fonts.googleapis.com/css2?family=Playpen+Sans:wght@700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e6e6fa; 
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #d0c8f0;
            padding: 10px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .logo-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-title h1 {
            color: #4169e1;
            font-size: 28px;
            margin: 0;
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            font-weight: normal;
        }

        .logo-title h2 {
            font-size: 16px;
            color: #4169e1;
            margin: 0;
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            font-weight: normal;
        }

        nav a {
            margin: 0 15px;
            text-decoration: none;
            color: #3333cc;
            font-weight: bold;
            font-size: 16px;
        }

        .sotu-container {
            width: 100%;
            height: calc(100vh - 80px);
            position: relative;
            background: #000;
        }

        .sotu-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .footer {
            text-align: center;
            padding: 15px;
            font-size: 14px;
            color: #4169e1;
            background-color: #d0c8f0;
            font-family: "Playpen Sans", cursive;
        }

        @media (max-width: 768px) {
            header { flex-direction: column; text-align: center; gap: 15px; }
            .sotu-container { height: calc(100vh - 120px); }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-title">
            <img src="atomaker-logo.png" alt="Atomaker Logo" style="height:40px;">
            <div>
                <h1>Atomaker</h1>
                <h2>Visualizing the Invisible</h2>
            </div>
        </div>
        <nav>
            <a href="homepage.html">Home</a>
            <a href="aboutus.html">About Us</a>
            <a href="ourmission.html">Our Mission</a>
            <a href="layout.html">Layout</a>
        </nav>
    </header>

    <div class="sotu-container">
        <iframe src="/sotu/" title="Scale of the Universe" allowfullscreen></iframe>
    </div>

</body>
</html>
